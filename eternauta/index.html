<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20fill='%23141626'/%3E%3Ccircle%20cx='8'%20cy='8'%20r='5'%20fill='%23ffcf6e'/%3E%3Ccircle%20cx='8'%20cy='8'%20r='3'%20fill='%23c8f0f8'/%3E%3C/svg%3E" />
    <title>El Eternauta - la nevada (demo)</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      canvas.cursor-hidden {
        cursor: none;
      }
      .pixel-cursor {
        position: fixed;
        left: 0;
        top: 0;
        display: none;
        pointer-events: none;
        z-index: 9999;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        will-change: transform;
      }
      #error {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        color: #ecd6a4;
        background: #0b0c1d;
        font: 16px/1.5 monospace;
        text-align: center;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="error"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
